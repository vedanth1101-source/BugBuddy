spring.application.name=bugbuddy
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/bugbuddy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Removed explicit MySQLDialect to allow Hibernate auto-detection)

# Gemini AI Endpoint (Updated to supported stable model)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY}