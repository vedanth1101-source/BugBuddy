spring.application.name=bugbuddy
server.port=${PORT:8080}

# MySQL Datasource
# Tell Spring Boot to use Railway's dynamic cloud port, or 8080 on your laptop
server.port=${PORT:8080}

# Dynamic Database Connection
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bugbuddy}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}

# (Keep any existing JPA/Hibernate settings you already have below this)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Removed explicit MySQLDialect to allow Hibernate auto-detection)

# Gemini AI Endpoint (Updated to supported stable model)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY}