spring.application.name=bugbuddy

# Tell Spring Boot to use Railway's dynamic cloud port, or 8080 on your laptop
server.port=${PORT:8080}

# Dynamic Database Connection
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bugbuddy}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI Endpoint
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY}

# Rate Limiting — applied to POST /api/bugs/analyze
# Adjust via BUGBUDDY_RATE_LIMIT env var or directly here.
bugbuddy.rate-limit.requests-per-minute=10

# API Key Authentication — optional; leave blank to disable.
# When set, POST /api/bugs/analyze requires the header: X-API-Key: <value>
# Set via environment variable BUGBUDDY_API_KEY on your hosting platform.
bugbuddy.api.key=${BUGBUDDY_API_KEY:}