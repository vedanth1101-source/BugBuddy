# H2 in-memory datasource for Spring Boot test execution
spring.datasource.url=jdbc:h2:mem:bugbuddy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

# Dummy Gemini values — BugServiceTest mocks RestTemplate so these are never used.
gemini.api.url=http://localhost:9999/fake-gemini
gemini.api.key=test-key-not-used

# Disable API key auth in tests — all requests pass through the filter.
bugbuddy.api.key=

# High rate limit in tests so unit tests are never throttled.
bugbuddy.rate-limit.requests-per-minute=1000
